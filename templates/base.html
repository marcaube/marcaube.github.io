<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="have-i-been-pwned-verification" value="8b6f3354b00cbe1732798b3bdccf8a92">

    <title>{% if page.title %}{{ page.title }}{% else %}{{ config.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ config.description }}{% endif %}">

    <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">

    <link rel="stylesheet" href="{{ get_url(path="assets/css/style.css") }}">
    <!--[if IE 8]><link rel="stylesheet" href="{{ get_url(path="assets/css/ie.css") }}"><![endif]-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/1.0.1/anchor.min.css">
    <style>
        .anchorjs-link {
            transition: all .25s linear;
        }
        .anchorjs-link:link, .anchorjs-link:visited {
            color: #2E8B57;
        }
        .anchorjs-link:hover {
            color: #1B5233;
        }
        *:hover > .anchorjs-link {
            margin-left: -1.125em !important;
        }
    </style>

    {% if page.extra.canonical %}
        <link rel="canonical" href="{{ page.extra.canonical }}">
    {% else %}
        <link rel="canonical" href="{{ current_url }}">
    {% endif %}

    <link rel="author" href="humans.txt">

    <link rel="serviceworker" href="/serviceworker.js">

    <script src="{{ get_url(path="assets/js/modernizr.custom.15390.js") }}" type="text/javascript"></script>
</head>
    <body>
       <header class="header">
     <div class="container">
         <h1 class="logo"><a href="{{ get_url(path="/") }}">{{ config.title }}</a></h1>
         <nav class="nav-collapse">
             <ul class="noList">
                 {% for link in config.extra.navigation %}
                     <li class="element {% if loop.first %}first{% endif %} {% if current_path == link.url %}current{% endif %} {% if loop.last %}last{% endif %}">
                         <a href="{{ get_url(path=link.url) }}">{{ link.title }}</a>
                     </li>
                 {% endfor %}
             </ul>
         </nav>
     </div>
 </header>

       <div class="content">
          <div class="container">
             {% block content %}{% endblock %}
          </div>
       </div>

       <footer class="footer">
    <div class="container">
        <div class="footer-links">
            <ul class="noList">
                {% if config.extra.mastodon %}
                    <li>
                        <a href="{{ config.extra.mastodon }}">

                            </svg>

                {% endif %}
                {% if config.extra.github %}
                    <li>
                        <a href="https://github.com/{{ config.extra.github }}">

                            </svg>
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</footer>
       <!-- Add jQuery and other scripts -->
<script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
<script>window.jQuery || document.write('<script src="{{ get_url(path="assets/js/jquery-1.11.2.min.js") }}"><\/script>')</script>
<script src="{{ get_url(path="assets/js/dropcap.min.js") }}"></script>
<script src="{{ get_url(path="assets/js/responsive-nav.min.js") }}"></script>
<script src="{{ get_url(path="assets/js/scripts.js") }}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/1.0.1/anchor.min.js"></script>
<script>
    anchors.options = {
        placement: 'left',
        visible: 'hover'
    };
    anchors.add('.post h2, .post h3');
</script>

<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker.register('/serviceworker.js');

        if (navigator.serviceWorker.controller) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.controller.postMessage('trimCaches');
            })
        }
    }
</script>
    </body>
</html>
